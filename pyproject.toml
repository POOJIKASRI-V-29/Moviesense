[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviesense"
version = "0.1.0"
description = "Sentence-based movie genre classification and evidence-based cast recommendation (CMU Movie Summary Corpus)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

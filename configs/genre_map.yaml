# Coarse genre mapping for MovieSense (report §7.4 "Inconsistent genre labels", §7.5).
#
# Built from the Freebase genre frequencies in reports/eda_freebase_genres.json
# (363 distinct names on the 42,207 joined movies). Each Freebase name maps to one or more
# coarse targets; compound names (e.g. "Romantic comedy") map to all their parents.
#
# Deliberately UNMAPPED (ignored as labels): production format, era, origin or distribution
# attributes that describe how/where a film was made rather than its story, and that a plot
# sentence cannot evidence: World cinema, Black-and-white, Indie, Short Film, Japanese/Chinese/
# Filipino Movies, Bollywood, Tollywood, Tamil/Malayalam cinema, Silent film, Film adaptation,
# Television movie, Cult, B-movie, Pre-Code, New Hollywood, Remake, Art film, Experimental film,
# Avant-garde, Computer Animation, Stop motion, Animation, Anime, Animated cartoon, Pornographic
# movie, Adult, Softcore Porn, Erotica, Sexploitation, Ensemble Film, Roadshow theatrical release,
# Film, Fan film, Movie serial, Dogme 95, Albino bias, etc. Low-frequency names not listed below
# are also unmapped. Targets whose total support after cleaning is below `min_support`
# are dropped by scripts/build_dataset.py and reported in reports/data_report.json.
version: "1.0"
min_support: 400
targets:
  - Action
  - Adventure
  - Biography
  - Comedy
  - Crime
  - Documentary
  - Drama
  - Family
  - Fantasy
  - Historical
  - Horror
  - Musical
  - Mystery
  - Romance
  - Science Fiction
  - Sports
  - Thriller
  - War
  - Western
